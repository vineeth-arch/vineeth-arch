name: Refresh studio activity
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate public data handling
        run: node --test scripts/profile.test.mjs
      - name: Refresh public activity and artwork
        run: node scripts/refresh.mjs
      - name: Save changed snapshot
        run: |
          git add content/activity.json assets/studio/activity.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public profile activity'
          git push
